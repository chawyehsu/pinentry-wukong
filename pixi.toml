[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tasks]
test = { cmd = "cargo-insta test --review", description = "Run tests with insta snapshot testing" }
codecov = { cmd = "cargo-llvm-cov llvm-cov --all-features --workspace", description = "Run code coverage" }

[dependencies]
cargo-insta = ">=1.46.3,<2"
cargo-llvm-cov = ">=0.8.4,<0.9"
