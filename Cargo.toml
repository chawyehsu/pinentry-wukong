[package]
name = "cliapp"
description = "A CLI App project template"
homepage = "https://github.com/chawyehsu/template-cliapp"
repository = "https://github.com/chawyehsu/template-cliapp"
version = "0.1.0"
authors = ["Chawye Hsu <su+git@chawyehsu.com>"]
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
clap_complete = "4.5.66"
miette = { version = "7.6.0", features = ["fancy"] }
tokio = { version = "1.50.0", features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
assert_fs = "1.1.3"
insta-cmd = "0.6.0"

[profile.release]
debug = false
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1
