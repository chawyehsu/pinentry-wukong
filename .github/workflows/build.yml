name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - {
              name: "Windows",
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              zip: pinentry-wukong-x86_64-pc-windows-msvc.zip,
            }
          - {
              name: "Windows ARM",
              target: aarch64-pc-windows-msvc,
              os: windows-11-arm,
              zip: pinentry-wukong-aarch64-pc-windows-msvc.zip,
            }
          - {
              name: "Linux x86_64",
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              zip: pinentry-wukong-x86_64-unknown-linux-gnu.tar.gz,
            }
          - {
              name: "Linux Aarch64",
              target: aarch64-unknown-linux-gnu,
              os: ubuntu-24.04-arm,
              zip: pinentry-wukong-aarch64-unknown-linux-gnu.tar.gz,
            }
          - {
              name: "macOS ARM",
              target: aarch64-apple-darwin,
              os: macos-latest,
              zip: pinentry-wukong-aarch64-apple-darwin.tar.gz,
            }
    name: Build - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Setup
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: DBus requirements (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt install -y libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip Artifacts [Linux]
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          case ${{ matrix.target }} in
            aarch64-unknown-linux-gnu) sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu ;;
          esac

          STRIP="strip"
          case ${{ matrix.target }} in
            aarch64-unknown-linux-gnu) STRIP="aarch64-linux-gnu-strip" ;;
          esac;
          "${STRIP}" target/${{ matrix.target }}/release/pinentry-wukong

      - name: Prepare Artifacts [Unix]
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pinentry-wukong .
          tar czvf ${{ matrix.zip }} pinentry-wukong LICENSE README.md

      - name: Prepare Artifacts [Windows]
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pinentry-wukong.exe .
          7z a ${{ matrix.zip }} pinentry-wukong.exe LICENSE README.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
